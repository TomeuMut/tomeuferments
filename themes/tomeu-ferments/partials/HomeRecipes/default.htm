<div class="px-48 py-72">
    <div class="grid grid-cols-12 gap-8">
    {% for recipe in recipes %}
        <a href="{{ 'receta-interior'|page({slug: recipe.slug }) }}" class="col-span-3 relative group overflow-hidden h-[570px] cursor-pointer -md:col-span-12 -md:h-[400px]">
            <img class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-105" src="{{recipe.img_featured.getThumb(445,570, {mode:'auto' , extension: 'webp' })}}" alt="">
            <div class="absolute inset-0 bg-black/30 group-hover:bg-black/60 transition duration-500"></div>
            <div class="text-white text-[20px] leading-[64px] uppercase absolute top-0 left-0 p-40">
                {{recipe.tags.first().name}}
            </div>
            <div class="absolute bottom-[10%] left-0 right-0 px-10 transition-all duration-500 group-hover:translate-y-[-80px] px-40">
                <h3 class="text-white text-[40px] leading-[54px] uppercase">{{recipe.title}}</h3>
            </div>
            <div class="absolute left-0 right-0 px-40 bottom-10 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-100 translate-y-6 group-hover:translate-y-[-120px]">
                <p class="text-white text-[15px] mb-4">
                    {{recipe.description|striptags|slice(0, 100)}}
                </p>
                <div class="c-btn__primary">
                    <img src="{{'assets/images/icons/arrow-right.svg'|theme}}" class="svg transition-transform duration-300 fill-primary">
                </div>
            </div>
        </a>
      {% endfor %}
    </div>
</div>
