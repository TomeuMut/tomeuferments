<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" href="{{'assets/images/favicon.ico' | theme}}">
    {% component 'seoPage' %}
    {% placeholder rwSeo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ 'assets/css/app.css'|theme }}"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    {% styles %}
    <style>
        .recipe-item {
            transition: opacity 0.5s ease;
        }

        .opacity-0 {
            opacity: 0;
        }

        .opacity-100 {
            opacity: 1;
        }

        .pointer-events-none {
            pointer-events: none;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    {% placeholder analytics %}
</head>
<body>

    {% placeholder noscripts %}

    {% partial 'site/header' %}

    {% page %}

    {% partial 'site/footer' %}

    {% framework extras %}

    <script src="{{ 'assets/js/main.js'|theme }}"></script>
    <script src="{{'assets/js/gdpr.min.js'|theme}}"></script>

    <script>
        const notice = new CookieNotice({
            locale: 'es', // Idioma del aviso de cookies, default: es
            timeout: 500, // Delay para que aparezca el aviso default: 500
            expiration: 30, // expiración de la cookie, default: 30
            statement: "{{'politica-de-cookies'|page}}", // Link a la página de cookies
            performance: ['preferred_locale'], // Array con las cookies de rendimiento
            analytics: ['ga'], // Array con las cookies de analítica
            marketing: ['sharp_cookie'], // Array con las cookies de marketing
            gtm: 'G-1CEJ4JTJ30', // GTM ID
            hot_reload: false, // Hot reload de las cookies
            color: '#D4D4D4', // Forma rápida de indicar el color de énfasis
            buttonConfig: 'change-consent' // ID de botón para configurar las cookies externamente
        });
    </script>

</body>
</html>
